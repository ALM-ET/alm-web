name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: alm-web }

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SDK_REPO || 'digicom/alm-sdk' }}
          path: alm-sdk
          token: ${{ secrets.SDK_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: alm-web/package-lock.json }

      - name: Build SDK
        working-directory: alm-sdk
        run: npm ci && npm run build

      - run: npm ci
        working-directory: alm-web
      - run: npm run typecheck
        working-directory: alm-web
      - run: npm test
        working-directory: alm-web
      - run: npm run build
        working-directory: alm-web

      - uses: actions/upload-artifact@v4
        with:
          name: alm-web-dist
          path: alm-web/dist
          retention-days: 7
